{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CricVision{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'dashboard:home' %}">CricVision</a>

        <nav>
            <a href="{% url 'dashboard:home' %}">Home</a>
            <a href="{% url 'teams:list' %}">Teams</a>
            <a href="{% url 'matches:list' %}">Live Scores</a>
            {% if user.is_staff %}
                <a href="{% url 'scoring:scorer_home' %}">Live Scorer</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        CricVision - Local Cricket, Live.
    </footer>

</body>
</html>
